name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["incoming/**"]
  pull_request:

permissions:
  contents: read

# A newer run for the same pull request replaces the older one; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Required files, placeholders, secrets and Markdown links
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          problems = []

          required = [
              "README.md", "README.ar.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md",
              "SECURITY.md", "CODE_OF_CONDUCT.md", "incoming/README.md",
          ]
          for f in required:
              if f not in files:
                  problems.append(f"missing required file: {f}")

          secret = re.compile(r"(\.(jks|keystore|p12|pfx)$)|((^|/)(keystore\.properties|local\.properties|\.env)$)")
          for f in files:
              if secret.search(f):
                  problems.append(f"signing or secret file is tracked: {f}")

          placeholder = re.compile(r"github\.com/(OWNER|YOUR[-_ ]?(NAME|USER(NAME)?))/", re.I)
          for f in files:
              if f.endswith((".md", ".yml", ".yaml", ".kts", ".toml")) and not f.startswith(".github/workflows/"):
                  text = pathlib.Path(f).read_text(encoding="utf-8", errors="replace")
                  if placeholder.search(text):
                      problems.append(f"placeholder owner left in {f}")

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)(?:\s+\"[^\"]*\")?\)")
          for f in files:
              if not f.endswith(".md"):
                  continue
              text = pathlib.Path(f).read_text(encoding="utf-8", errors="replace")
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              for target in link.findall(text):
                  if re.match(r"^[a-z][a-z0-9+.-]*:", target, re.I) or target.startswith("#"):
                      continue
                  path = target.split("#")[0].split("?")[0]
                  if not path:
                      continue
                  base = pathlib.Path(f).parent
                  resolved = os.path.normpath(path.lstrip("/") if path.startswith("/") else base / path)
                  if not os.path.exists(resolved):
                      problems.append(f"{f}: broken relative link -> {target}")

          if problems:
              print("Repository hygiene check failed:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print(f"Repository hygiene OK ({len(files)} tracked files checked)")
          PY

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Unit tests, lint and debug build
        run: gradle testDebugUnitTest lintDebug assembleDebug --continue --stacktrace

      # The reports only exist on the temporary runner; keep them so they can be downloaded.
      - name: Print the lint report in the log
        if: always()
        run: |
          F=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$F" ]; then cat "$F"; else echo "No lint text report found"; fi
      - name: Upload reports (lint, tests)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: warn
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apk-namer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
