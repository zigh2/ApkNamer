name: Release from incoming zip

# Drop  incoming/ApkNamer-v1.0.zip  (any name containing vX.Y or vX.Y.Z) into the repo.
# The workflow replaces the project files with the zip contents, runs the tests, builds the APK,
# commits the new project state and publishes a GitHub Release with a direct-download APK.

on:
  push:
    branches: [main]
    paths: ["incoming/*.zip"]
  workflow_dispatch:
    inputs:
      zip:
        description: "Zip file name inside incoming/ (leave empty to use the highest version)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the zip and read its version
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_ZIP: ${{ inputs.zip }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ZIP:-}" ]; then
            NAME="$INPUT_ZIP"
          else
            CHANGED=""
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'incoming/*.zip' || true)
            fi
            if [ -z "$CHANGED" ] && { [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; }; then
              CHANGED=$(ls incoming/*.zip 2>/dev/null || true)
            fi
            NAME=$(echo "$CHANGED" | sed 's#.*/##' | grep -v '^$' | sort -V | tail -n1 || true)
          fi
          if [ -z "$NAME" ]; then
            echo "No zip to process (for example, a zip was just deleted)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP="incoming/$NAME"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP not found"; exit 1
          fi
          VERSION=$(echo "$NAME" | grep -oE 'v[0-9]+(\.[0-9]+){1,2}' | tail -n1 | sed 's/^v//' || true)
          if [ -z "$VERSION" ]; then
            echo "::error::The zip name must contain a version such as v1.0 (got: $NAME)"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          {
            echo "found=true"
            echo "zip=$ZIP"
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Replace project files with the zip contents
        if: steps.pick.outputs.found == 'true'
        env:
          ZIP: ${{ steps.pick.outputs.zip }}
          VERSION: ${{ steps.pick.outputs.version }}
          CODE: ${{ steps.pick.outputs.code }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP"
          shopt -s dotglob
          ENTRIES=("$TMP"/*)
          SRC="$TMP"
          if [ ${#ENTRIES[@]} -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then SRC="${ENTRIES[0]}"; fi
          if ! ls "$SRC"/settings.gradle* >/dev/null 2>&1; then
            echo "::error::The zip does not look like the project (settings.gradle* not found at its root)"; exit 1
          fi
          # Wipe the old project but keep git data, the incoming archive and the workflows.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name incoming ! -name .github -exec rm -rf {} +
          if [ -d .github ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          fi
          rsync -a --exclude='/incoming' --exclude='/.github/workflows' --exclude='/.git' "$SRC"/ ./
          # Stamp the version from the zip name into the Gradle config.
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/; s/versionCode = [0-9]+/versionCode = ${CODE}/" app/build.gradle.kts

      - uses: actions/setup-java@v5
        if: steps.pick.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.pick.outputs.found == 'true'
        with:
          gradle-version: "8.9"

      - name: Prepare signing key (optional)
        if: steps.pick.outputs.found == 'true'
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret: building a debug-signed APK. Each build gets a different key, so it cannot be installed over a previous one. See incoming/README.md."
          fi

      - name: Test and build the APK
        if: steps.pick.outputs.found == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then TASK=assembleRelease; DIR=release; else TASK=assembleDebug; DIR=debug; fi
          gradle testDebugUnitTest "$TASK" --stacktrace
          APK=$(ls app/build/outputs/apk/$DIR/*.apk | head -n1)
          mkdir -p "$RUNNER_TEMP/dist"
          # One asset per release, named with the version: ApkNamer-v1.10.apk
          cp "$APK" "$RUNNER_TEMP/dist/ApkNamer-v${VERSION}.apk"

      - name: Commit the new project state
        if: steps.pick.outputs.found == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          NAME: ${{ steps.pick.outputs.name }}
          ZIP: ${{ steps.pick.outputs.zip }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The zip has been consumed: remove it from incoming/ in the same commit.
          git rm -q --ignore-unmatch -- "$ZIP"
          git add -A
          if git diff --cached --quiet; then
            echo "Project already identical to the zip; nothing to commit."
            exit 0
          fi
          git commit -q -m "Release v${VERSION}: replace project with ${NAME}"
          git log -1 --stat | tail -n 5
          # Rebase on the latest main and retry a few times, printing the real git error if it keeps failing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::Could not push the new project state to main (see the git messages above)"
          exit 1

      - name: Publish GitHub Release
        if: steps.pick.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          NAME: ${{ steps.pick.outputs.name }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          FILE="ApkNamer-v${VERSION}.apk"
          NOTES="Built automatically from incoming/${NAME}."
          if [ "$SIGNED" != "true" ]; then NOTES="$NOTES (debug-signed build: no release keystore configured)"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Keep exactly one APK per release: remove any other uploaded asset (e.g. from older versions of this workflow).
            for ASSET in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ "$ASSET" != "$FILE" ]; then gh release delete-asset "$TAG" "$ASSET" --yes; fi
            done
            gh release upload "$TAG" "$RUNNER_TEMP/dist/$FILE" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/dist/$FILE" \
              --title "APK Namer $TAG" --notes "$NOTES" --target "$(git rev-parse HEAD)" --latest
          fi
          {
            echo "### APK Namer $TAG published"
            echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
            echo "Latest release page: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
